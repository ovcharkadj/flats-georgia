name: Digest

on:
  workflow_dispatch:
    inputs:
      always_send:
        description: "Send a message even if nothing is new / already sent today"
        type: boolean
        default: false
  schedule:
    # GitHub's own scheduler proved unreliable for this repo (whole days with 0
    # runs), so the real trigger is an external cron (cron-job.org) hitting the
    # workflow_dispatch API every ~30 min - see README. This schedule stays as a
    # no-cost backup in case GitHub's cron ever starts working again; the
    # concurrency group + dedup make duplicate triggers harmless.
    # 07:00-19:59 UTC = 11:00-23:59 Tbilisi.
    - cron: "17,47 7-19 * * *"

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: pip install -e .

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.always_send }}" = "true" ]; then
            python -m flats_georgia --always-send
          else
            python -m flats_georgia
          fi

      - name: Commit updated state
        run: |
          if git diff --quiet -- state/seen_ids.json; then
            echo "no state change"
            exit 0
          fi
          git config user.name "flats-georgia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_ids.json
          git commit -m "chore(state): update seen ids [skip ci]"
          git pull --rebase --autostash origin main
          git push
