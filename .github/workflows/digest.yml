name: Digest

on:
  workflow_dispatch:
  schedule:
    # GitHub frequently drops scheduled runs, so poll often and off the hour;
    # the pipeline decides what to do. 07:00-19:59 UTC = 11:00-23:59 Tbilisi.
    # Runs before 11:00 Tbilisi (quiet hours) and delayed runs past midnight
    # send nothing. The once-a-day digest goes out on the first run at/after
    # 11:00 Tbilisi even if the 11:00 slot itself was skipped.
    - cron: "17,47 7-19 * * *"

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: pip install -e .

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m flats_georgia --always-send
          else
            python -m flats_georgia
          fi

      - name: Commit updated state
        run: |
          if git diff --quiet -- state/seen_ids.json; then
            echo "no state change"
            exit 0
          fi
          git config user.name "flats-georgia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_ids.json
          git commit -m "chore(state): update seen ids [skip ci]"
          git pull --rebase --autostash origin main
          git push
