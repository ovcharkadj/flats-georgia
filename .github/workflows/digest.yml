name: Digest

on:
  workflow_dispatch:
  schedule:
    # times are UTC; Georgia is UTC+4 year-round. Nothing after 20:00 Tbilisi -
    # GitHub can delay a run by 1-2h and the pipeline also enforces quiet hours
    # (00:00-11:00 Tbilisi), so a late run just does nothing.
    - cron: "0 7 * * *"  # 11:00 Tbilisi - guaranteed daily digest
    - cron: "0 10 * * *" # 14:00 Tbilisi - only if something is new
    - cron: "0 13 * * *" # 17:00 Tbilisi - only if something is new
    - cron: "0 16 * * *" # 20:00 Tbilisi - only if something is new

concurrency:
  group: digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - run: pip install -e .

      - name: Run digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "0 7 * * *" ]; then
            python -m flats_georgia
          else
            python -m flats_georgia --always-send
          fi

      - name: Commit updated state
        run: |
          if git diff --quiet -- state/seen_ids.json; then
            echo "no state change"
            exit 0
          fi
          git config user.name "flats-georgia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_ids.json
          git commit -m "chore(state): update seen ids [skip ci]"
          git push
