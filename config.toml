# MyHome.ge rent-watcher configuration. No secrets here (see .env / GitHub secrets).
# Changing any value in [filter] or the schedule requires the owner's approval
# (see SPEC.md "Boundaries").

[filter]
city = 1              # Tbilisi
deal_type = 2         # long-term rent (1=sale, 3=lease, 7=daily rent)
real_estate_type = 1  # apartment
currency = 2          # USD (1=GEL, 3=EUR)
price_from = 300
price_to = 500
urbans = [47]         # "Saburtalo" urban area (covers metro stations 1-5)

[behaviour]
request_delay_seconds = 1.5
request_jitter_seconds = 1.0
message_pause_seconds = 3.0      # gap between Telegram messages (avoids the ~20/min bulk limit)
max_pages_per_run = 10
max_stored_ids = 20000
timezone = "Asia/Tbilisi"
always_send_hours_local = [11]  # local hours whose run always sends, even with nothing new

[source]
api_url = "https://api-statements.tnet.ge/v1/statements"
website_key = "myhome"
search_page_url = "https://www.myhome.ge/en/real-estate/"
homepage_url = "https://www.myhome.ge/en/"
listing_url_template = "https://www.myhome.ge/en/pr/{id}/"
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"

[state]
path = "state/seen_ids.json"
